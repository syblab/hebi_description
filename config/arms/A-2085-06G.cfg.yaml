# HEBI Robot Config file
# Dual-arm template based on your single-arm config
# See https://github.com/HebiRobotics/robot-config/blob/main/README.adoc

version: 1.1

arms:
  left:
    families: ["LeftArm"]
    names: ["J1_base", "J2_shoulder", "J3_elbow", "J4_wrist1", "J5_wrist2", "J6_wrist3"]
    hrdf: "hrdf/A-2240-06G.hrdf"

    gains:
      default: "gains/A-2240-06.xml"
      gripper: "gains/A-2255-01.xml"

    feedback_frequency: 100    # [Hz]
    command_lifetime: 0.25     # [s]

    user_data:
      ik_seed_pos: [0.01, 1.0, 2.5, 1.5, -1.5, 0.01]
      home_position: [0.0, 1.2, 1.8, 2.2, -1.57, 0.0]

      has_gripper: true
      gripper_open_effort: 1
      gripper_close_effort: -5

    plugins:
      - type: GravityCompensationEffort
        name: left_gravComp
        enabled: true
        ramp_time: 5

      - type: DynamicsCompensationEffort
        name: left_dynamicsComp
        enabled: true
        ramp_time: 5

      - name: left_gasSpringCompensation
        type: EffortOffset
        enabled: false
        ramp_time: 5
        offset: [0, -7, 0, 0, 0, 0]

  right:
    families: ["RightArm"]
    names: ["J1_base", "J2_shoulder", "J3_elbow", "J4_wrist1", "J5_wrist2", "J6_wrist3"]
    hrdf: "hrdf/A-2240-06G.hrdf"

    gains:
      default: "gains/A-2240-06.xml"
      gripper: "gains/A-2255-01.xml"

    feedback_frequency: 100    # [Hz]
    command_lifetime: 0.25     # [s]

    user_data:
      ik_seed_pos: [0.01, 1.0, 2.5, 1.5, -1.5, 0.01]
      home_position: [0.0, 1.2, 1.8, 2.2, -1.57, 0.0]

      has_gripper: true
      gripper_open_effort: 1
      gripper_close_effort: -5

    plugins:
      - type: GravityCompensationEffort
        name: right_gravComp
        enabled: true
        ramp_time: 5

      - type: DynamicsCompensationEffort
        name: right_dynamicsComp
        enabled: true
        ramp_time: 5

      - name: right_gasSpringCompensation
        type: EffortOffset
        enabled: false
        ramp_time: 5
        offset: [0, -7, 0, 0, 0, 0]

coordination:
  mode: synchronized
  control_frequency: 100   # [Hz]
  collision_avoidance: true
  e_stop_linked: true